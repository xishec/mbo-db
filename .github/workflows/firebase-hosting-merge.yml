name: Deploy Web

on:
  push:
    branches:
      - main

jobs:
  deploy_web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Create production env file
        run: |
          cat > .env.production << EOF
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=mbodatabase.firebaseapp.com
          VITE_FIREBASE_DATABASE_URL=https://mbodatabase-default-rtdb.firebaseio.com
          VITE_FIREBASE_PROJECT_ID=mbodatabase
          VITE_FIREBASE_STORAGE_BUCKET=mbodatabase.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID=972778023375
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          EOF

      - name: Build web app
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MBODATABASE }}'
          channelId: live
          projectId: mbodatabase
