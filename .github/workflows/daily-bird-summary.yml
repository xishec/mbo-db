name: Daily Bird Summary

on:
  schedule:
    - cron: "59 11 * * *"
      timezone: "America/Toronto"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send_email:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Send daily bird summary
        run: npm run email:daily-birds
        env:
          TZ: America/Toronto
          FIREBASE_DATABASE_URL: https://mbodatabase-default-rtdb.firebaseio.com
          FIREBASE_ENVIRONMENT: prod
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MBODATABASE }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
